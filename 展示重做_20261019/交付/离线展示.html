<script>const slides=[{"title": "听见《末代皇帝》", "body": [], "notes": "大家好，今天我们从电影音乐的角度看《末代皇帝》。这部电影有很大的历史跨度，也有非常鲜明的宫殿、色彩和人物形象。我们的主问题是：音乐怎样把这些不同年代、不同处境联系起来？先用几页认识影片，再听片头、Open the Door、追逐与雨中离开的段落，最后回到主题音乐与结尾。", "layout": "cover", "speaker": "A", "minutes": 0.5, "sources": [], "prep": "", "images": ["09328_重访紫禁城.jpg"], "subtitle": "音乐主题、人物与时代"}, {"title": "影片资料：一部跨国合作的历史传记片", "body": ["1987年　导演：贝尔纳多·贝托鲁奇", "主演：尊龙、陈冲、彼得·奥图尔", "摄影：维托里奥·斯托拉罗", "原创配乐：坂本龙一、David Byrne、苏聪"], "notes": "先区分影片讲什么，以及它怎样讲。它以溥仪的人生为中心，是历史传记题材，也有史诗电影的规模。国际演员和跨国制作，使中国历史进入了一种具有明确创作视角的电影表达。我们讨论的是这部电影对人物和时代的呈现。音乐也来自不同创作经验，因此不能把整部配乐都放到坂本龙一一个人名下。", "layout": "text", "speaker": "A", "minutes": 1, "sources": ["P05", "AWARD"], "prep": ""}, {"title": "上映、票房与奖项", "body": ["北美公映：1987年11月20日", "北美累计票房：43,984,230美元", "1988年第60届奥斯卡：9项提名，9项获奖", "其中包括最佳影片、导演、摄影与原创配乐"], "notes": "这里把可以核查的资料先列清楚。北美公映日期和票房采用Box Office Mojo的对应口径；这不是影片所有国家的首次上映日期，也不把北美数值写成全球票房。奖项按奥斯卡官方记录：九项提名全部获奖，音乐、声音、摄影、剪辑等都在其中。这说明影片获得了重要行业认可。至于这些艺术处理为什么有效，还需要后面的片段分析来回答。", "layout": "text", "speaker": "A", "minutes": 1, "sources": ["FACT", "AWARD"], "prep": "票房网站国际历史数据不完整，不引用该页worldwide为完整全球票房。"}, {"title": "评论如何评价它？", "body": ["Ebert：个人行动与庞大秩序之间的反差", "Thomson：史诗场面中的日常细节", "Kempley：对华丽形式与戏剧张力提出质疑", "行业荣誉、评论观点与个人感受分别讨论"], "notes": "客观介绍还包括把评论的分歧交代出来。Ebert把人物受到的限制作为理解影片的一条线索；Thomson看见宏大场面里很细小的日常生活；Kempley则对影片的戏剧力量提出批评。这些是可追溯到作者的评价，不是统一的结论。我们稍后提出自己的判断时，也要说明它是由哪些片段支持的。", "layout": "text", "speaker": "A", "minutes": 1.2, "sources": ["R01", "R02", "R03"], "prep": ""}, {"title": "故事：皇帝身份怎样改变？", "body": ["幼年登基，在宫城内成长", "离宫后谋求复辟，成为伪满洲国傀儡", "战后被囚、改造，成为普通公民", "晚年重新走进已开放的故宫"], "notes": "先用这一页交代故事。影片从1950年被囚的溥仪开始，通过回忆讲述他的前半生。小时候，他在宫里被当作皇帝对待，对外面的世界却知道得很少。离开紫禁城以后，他仍想恢复帝位，后来依靠日本势力，成为伪满洲国的傀儡皇帝。战后被囚、接受改造，最后成为普通公民。片名中的“末代”，既标明了帝制结束的位置，也把一个问题留给观众：当皇帝这个身份消失以后，这个人怎样生活？我们选的几个片段，就放在这条变化里看。", "layout": "split", "speaker": "A", "minutes": 1.2, "sources": ["P05"], "prep": "", "images": ["04844_紫禁城离开.jpg"]}, {"title": "叙事：囚禁中的现在，通向过去", "body": ["1950年的囚禁生活，构成回忆的入口", "童年、宫廷与伪满经历逐步展开", "音乐可以跨过剪辑，组织时间的连续感"], "notes": "影片采用回忆框架，把被囚的现在与过去交替组织。这里比“多线性”更准确的说法，是有一个当下框架，里面逐步展开人物的经历。我们借用课堂展示里的方法，先找出画面时间怎样改变，再听音乐是否跨过这个变化。音乐因此不仅能表现情绪，也可能成为组织叙事的线索。后面的Open the Door就从这一步进入。", "layout": "split", "speaker": "A", "minutes": 1, "sources": ["COURSE", "SAMPLE"], "prep": "", "images": ["00378_割腕.jpg"]}, {"title": "画面提供处境，音乐赋予时间感", "body": ["远景、宫门：人物与制度空间的关系", "红墙、绿色物件：人生阶段与外部世界"], "notes": "这里把镜头和色彩压缩在一页。远景让人看见人物与建筑的比例，宫门决定人物能否继续移动。摄影师的创作自述还把颜色联系到人生阶段，绿色汽车和自行车就是其中的例子。理解这些背景，是为了听音乐进入画面后有什么变化：动作有没有更强的推进感，空间有没有显得更开阔或更封闭，转场有没有获得连续感。", "layout": "pair", "speaker": "A", "minutes": 1.1, "sources": ["P03", "COURSE"], "prep": "", "images": ["01640_童年奔跑全景.jpg", "02484_庄士敦到来.jpg"], "captions": ["人物与宫城的比例", "外部生活进入宫墙"]}, {"title": "三位作曲者的分工与经验", "body": ["坂本龙一：电子音乐经验与管弦乐创作", "David Byrne：片头Main Title Theme等", "苏聪：中国音乐创作与影片配乐", "听到“中国感”，还要追问音乐如何构成"], "notes": "我们准备时有一个很直接的疑问：东方管弦与电子合成器“碰撞”，具体是什么意思？可以先从创作班底看起。坂本龙一有YMO的电子音乐经历，Byrne来自Talking Heads，苏聪则有中国音乐创作背景。他们共同署名，却不意味着每一段都由三人一起写。下面每个例子都标明所听曲目，避免把片头、主题和场景音乐混成一个笼统的“末代皇帝主题曲”。", "layout": "text", "speaker": "A", "minutes": 1.1, "sources": ["AWARD", "P01", "ALBUM"], "prep": ""}, {"title": "创作背景：音乐怎样进入电影？", "body": ["坂本龙一先作为演员参与拍摄", "访谈回忆：短期写作，并寻找中国乐手录音", "真实演奏、电子音色与管弦乐可以共同存在", "音乐最后还要经过电影剪辑与混音"], "notes": "访谈里，坂本龙一说自己先参与表演，之后才接到配乐邀请。他谈到时间很紧，也谈到寻找中国音乐家录音。这使我们能把“传统与现代”说得具体一点：它涉及演奏材料，也涉及制作方式。最后听到的成品又经过剪辑、录音和混音，所以曲目、演奏乐器与影片中的声部，需要分别核对。接下来先听Byrne的片头。", "layout": "text", "speaker": "A", "minutes": 1, "sources": ["P01"], "prep": "访谈是创作者回忆；具体天数不展开成夸张创作神话。"}, {"title": "Main Title Theme：先听，再看", "body": ["先留意重复的节奏与加入的声部", "宫殿画面出现后，你的联想改变了吗？"], "notes": "先听35秒。请留意哪些声音反复，哪些声音形成持续的背景，旋律和节奏谁更吸引注意。【播放后】同学可以用“清脆、持续、疏密、快慢”这样的词来描述，不必一开始就猜乐器。这段片头的作者是David Byrne。我们看到红色、宫殿和题字以后，很容易把声音与中国宫廷联系起来。这个联想来自音乐，也来自画面和已有经验。", "layout": "audio", "speaker": "A", "minutes": 1.5, "sources": ["P06", "COURSE"], "prep": "35秒，1—2人各用一个声音特征回答。", "images": ["00035_片头题字.jpg"], "media": "音频_10.m4a"}, {"title": "“故宫音色”可以拆成哪些问题？", "body": ["音色：起音、滑动、持续音与颗粒感", "组织：旋律、节奏、织体与力度", "组合：中国乐器、管弦乐和电子制作", "语境：宫殿画面与听众的文化经验"], "notes": "我们把最初的“故宫音色”问题拆成四层。第一层是音色本身，第二层是音乐怎样组织，第三层是演奏和制作的组合，第四层是它所在的电影语境。配乐评论会使用二胡、古筝、管弦乐或电子音色等词分析主题，我们把它作为回听的线索。具体到现场这一段，仍要听声部怎么出现。这样既能讨论音乐的文化特征，也不把电影配乐直接当作清代宫廷音乐的复原。", "layout": "text", "speaker": "A", "minutes": 1.1, "sources": ["P01", "R06"], "prep": "R06的乐器描述是有归属的分析；本稿未完成每条声部的听辨。"}, {"title": "Open the Door：一个可辨认的主题", "body": ["原声曲目：Open the Door　坂本龙一", "先记住开头乐句，再看它怎样进入回忆"], "notes": "请先听Open the Door开头30秒。我们这次先做一件很具体的事：记住开头乐句的轮廓，感受它怎样积累和停顿。参考展示把这段旋律看成串联人生转折的主题。对本次赏析来说，这是很好的比较方向：同一材料出现时，画面中的人物和处境是否已经不同？先看影片中一次从成年走向童年的转场。", "layout": "audio", "speaker": "A", "minutes": 1.3, "sources": ["ALBUM", "SAMPLE"], "prep": "仅为专辑开头摘录，不声称与下一段电影混音逐秒一致；不抄照片中未核实的短谱。", "images": ["00399_回忆宫门.jpg"], "media": "音频_02.m4a"}, {"title": "音乐怎样把成年与童年接起来？", "body": ["先找画面的时间跳转", "再听声音何时改变、何时延续"], "notes": "先看45秒。这里我们已经知道当下是囚禁生活，画面随后进入童年。【播放后】请先说出你注意到的剪辑点，再回想声音是立即改变，还是让上一段感受延续到新画面。讲义的“过渡音乐、连贯音乐”解释的正是音乐连接镜头和场面的作用。观众听到的音乐可以位于影片叙述层，所以它跨过几十年，并不要求两处现实空间里真有同一个声源。", "layout": "video", "speaker": "A", "minutes": 1.8, "sources": ["COURSE", "SAMPLE"], "prep": "45秒。现场定位实际音乐和音响的变化；未确认前不把所有延续都称为同曲。", "images": ["00390_首次转场.jpg"], "media": "02_首次回忆转场.mp4"}, {"title": "主题重现：从曲名走向叙事线索", "body": ["第一次：先建立可记忆的音乐材料", "再出现：比较场景、节奏与音色的改变", "人物处境改变，音乐联系带回先前记忆"], "notes": "主题音乐的作用之一，是让不同片段彼此记得。参考照片把Open the Door的数次出现与人生变化联系起来，也把Where Is Armo和它放在一起比较。我们借鉴这种方法，但判断要分两步：先听清材料是否相同或相近，再分析它与情节的关系。曲名相似、人物喊了同一句话，只能帮助定位，不能代替音乐比较。下面把焦点从回忆转场移到人物行动。", "layout": "text", "speaker": "B", "minutes": 1, "sources": ["COURSE", "SAMPLE"], "prep": "A转B。照片中“访日返回东北”等具体重现位置保存在研究资料，尚未逐段核实，不作为本页已证实目录。"}, {"title": "Where Is Armo?：先听行进感", "body": ["原声曲目：Where Is Armo?　坂本龙一", "听底层的推进与上层旋律如何配合"], "notes": "先听30秒。这里特别留意底层是否形成连续的运动，以及上方旋律怎样进入。参考展示用“大提琴的行进感”描述这段音乐，并把它和奔走画面联系起来。这给我们一个可检验的分析：推进感来自速度、重复节奏，还是音型和声部叠加？下面看追阿嬷的片段，把单听音乐的感受与声画结合后的感受放在一起。", "layout": "audio", "speaker": "B", "minutes": 1.1, "sources": ["ALBUM", "SAMPLE"], "prep": "30秒。具体大提琴声部来自参考展示，未独立确认，口头保持归属。", "images": ["02175_追阿嬷.jpg"], "media": "音频_03.m4a"}, {"title": "追阿嬷：音乐怎样组织奔跑？", "body": ["动作：奔跑、呼喊与追随", "声音：旋律推进、台词和停顿"], "notes": "阿嬷被送走，年幼的溥仪试图追上她。先看90秒。【播放后】这段不要只用“悲伤”概括，可以逐层说：镜头怎样从人物动作走到远景，呼喊在何处吸引注意，音乐是否让奔跑显得更连续。人物在远景里变小以后，他的动作与声音之间还保持着怎样的联系？这就能把画面里的距离，和音乐里的时间感一起讨论。", "layout": "video", "speaker": "B", "minutes": 2.4, "sources": ["COURSE"], "prep": "90秒；现场标出音乐、人声与环境声一次明显变化，避免把书签当cue起点。", "images": ["02185_追阿嬷奔跑.jpg"], "media": "05_追阿嬷.mp4"}, {"title": "追婉容：相似的行动，改变了的处境", "body": ["又一次追逐，又一次要求开门", "比较音乐材料，也比较声音与动作的关系"], "notes": "婉容被送走，成年溥仪再次追出，仍要别人开门。先看70秒。【播放后】两段可以从相似动作进入，但音乐分析不能到动作相似就结束。请比较刚才的推进方式：旋律轮廓是否相近，节奏怎样组织，停顿与呼喊又有什么不同？参考展示把两处放到Where Is Armo的联系下讨论，我们把它作为回听问题。人物处境的呼应已经能从画面看到，音乐联系则需要用刚听到的具体材料说明。", "layout": "video", "speaker": "B", "minutes": 2.1, "sources": ["SAMPLE", "COURSE"], "prep": "70秒。未独立核实同曲、调式或沿小调音阶级进，不能照抄照片中结论。", "images": ["08170_追婉容.jpg"], "media": "10_追婉容.mp4"}, {"title": "比较的重点：音乐在哪里加强了动作？", "body": ["节奏：与奔跑同向推进，还是保持自己的速度？", "情绪：与人物感受相近，还是形成距离？", "剪辑：连续、停顿与重现怎样组织段落？"], "notes": "讲义把音画同步与音画对位作为主要关系。对这两个片段，可以先听节奏和情绪有没有互相加强；如果音乐有自己的展开，再讨论它与画面的相对独立。我们不必把所有概念都用一遍。更有用的是指出某一处具体关系：哪一段推动动作，哪一处停顿把注意力交还给台词。这也能解释，同样是奔跑，为何不同场景给人的感受不完全一样。", "layout": "text", "speaker": "B", "minutes": 1.2, "sources": ["COURSE"], "prep": ""}, {"title": "Rain：先听音乐自身的表达", "body": ["Rain (I Want a Divorce)　坂本龙一", "暂时离开画面，听旋律、力度与空间感"], "notes": "先听30秒Rain。作曲者在访谈中专门谈到这首作品被导演团队听到时的反应，说明它在创作交流中很有力量。我们先不用他人的反应决定自己的感受，而是听音乐自身：旋律怎样展开，力度有没有起伏，声音是聚拢还是逐渐铺开。再把它放回文绣离开的场景，比较有了雨声、台词和动作以后，听觉重心怎样变化。", "layout": "audio", "speaker": "B", "minutes": 1.1, "sources": ["P01", "ALBUM"], "prep": "30秒。专辑摘录不等同于影片完全相同版本。", "images": ["05860_雨.jpg"], "media": "音频_06.m4a"}, {"title": "文绣离开：雨声、动作与配乐", "body": ["离婚的选择，通过动作落实", "声音怎样使“离开”获得不同意味？"], "notes": "文绣提出离婚，走进雨中，拒绝伞。先看65秒。【播放后】与溥仪追逐受阻相比，她走了出去。先把这个动作结果说清楚，再解释音乐的作用。如果觉得这里有释放感，就指出它与刚才单听原声时有什么联系，也说出雨声、台词或表演带来了什么。雨声属于环境音，Rain是配乐曲目；两者可以共同组织感受，却需要分别分析。", "layout": "video", "speaker": "B", "minutes": 2, "sources": ["P01", "COURSE"], "prep": "65秒。释放感是论证方向，不预设所有听众感受。", "images": ["05840_雨中出门.jpg"], "media": "09_雨中离开.mp4"}, {"title": "主题与变奏：同一材料的不同面貌", "body": ["A　Theme Variation 2　30秒", "B　The Last Emperor (Theme)　35秒", "先找旋律联系，再比较编配与音色"], "notes": "下面用两段原声录音比较主题与变奏。先听A，再听B。大家先找乐句、节奏或旋律走向的联系，再描述差别：哪一段更稀疏，哪一段层次更多，声音的质感和力度有什么变化？配乐评论特别提到Variation 2中的电子音色，我们把这个判断放到实际聆听里检验。这一比较说明，材料保持联系时，编配仍能改变表达。它也回应了我们对传统乐器、管弦乐与电子制作的疑问。", "layout": "audioPair", "speaker": "B", "minutes": 2, "sources": ["ALBUM", "R06", "COURSE"], "prep": "65秒。比较限两段专辑，不把它们的次序当作影片顺序。", "media": "音频_08.m4a", "secondMedia": "音频_09.m4a"}, {"title": "First Coronation：带着记忆再听一次", "body": ["First Coronation　坂本龙一", "先听35秒，再看晚年重返宫殿"], "notes": "这首曲目的名字是First Coronation，但参考展示把它放在了晚年重返宫殿的片段上，提醒我们关注音乐与记忆的关系。先听35秒，记住这次听到的旋律和声音层次，再看结尾。我们需要比较的是：影片怎样让过去的身份重新进入当下，音乐是否带来熟悉感，以及这种熟悉感有没有改变。曲名和场景之间的关系，需要由实际配乐来确认。", "layout": "audio", "speaker": "A", "minutes": 1.2, "sources": ["ALBUM", "SAMPLE"], "prep": "B转A。35秒。照片对结尾配乐的命名仅是待核对线索，不能由标题直接认定电影cue。", "images": ["09338_重访背影.jpg"], "media": "音频_01.m4a"}, {"title": "重返龙椅：音乐与身份的记忆", "body": ["昔日皇帝，向孩子说明自己的过去", "宏大空间中的小物件，把记忆带回来"], "notes": "晚年的溥仪回到开放的故宫，向孩子说明自己曾经是皇帝。看这92秒时，除了对话和小物件，也留意音乐、人声和音响如何改变注意力。【播放后】这个结尾把个人记忆放回宏大的历史空间。身份从前由礼仪不断确认，现在需要通过讲述和物件来证明。如果听到与前面相近的音乐材料，就可以说出它的联系；如果感受不同，也可以从声音层次和画面关系解释。", "layout": "video", "speaker": "A", "minutes": 2.4, "sources": ["SAMPLE", "R01"], "prep": "92秒。不把蝈蝈作为历史写实证据；不预设“最终自由”的单一结论。", "images": ["09385_重返龙椅.jpg"], "media": "13_龙椅与蝈蝈.mp4"}, {"title": "音乐的作用，放回整个声音结构里看", "body": ["有源／无源：音乐与故事空间的关系", "过渡与重现：连接镜头、时间和记忆", "静默：声音停顿，把注意力交给另一层"], "notes": "回顾几个案例，可以把问题分成三类：声源在哪里，音乐怎样连接片段，声音何时停顿。有源与无源解释音乐和故事空间的关系；过渡与主题重现帮助组织叙事；静默则通过声音的停顿改变节奏。音乐暂时退下时，台词和环境声可能更突出。用这些概念，是为了描述具体听到的关系。今天没有证据支持的类别，我们保留，不强行套用。", "layout": "text", "speaker": "A", "minutes": 1, "sources": ["COURSE"], "prep": ""}, {"title": "我们的评价：音乐把史诗带回个人经验", "body": ["主题联系，让相隔很远的场景彼此呼应", "编配与声画关系，使相似行动呈现不同意味", "音乐带来同情，也值得追问这种同情的方向"], "notes": "我们的评价是：音乐让观众在巨大历史跨度中，仍能跟随人物具体的行动和记忆。转场的连续、追逐的推进、离开的情绪变化，是我们选择这些例子的原因。但这种表达也值得反问：当音乐让我们更靠近人物时，会不会让我们忽略他的选择与责任？因此我们赞赏音乐组织叙事的能力，也保留对影片视角的讨论。这是根据选段提出的评价，和前面奖项、票房的资料分开。", "layout": "text", "speaker": "A", "minutes": 1.2, "sources": ["R01", "R02", "R03"], "prep": ""}, {"title": "讨论：你会选择哪一种听法？", "body": ["选一个片段，说出一处具体声音变化", "它加强了画面，还是让你产生另一层理解？", "如果去掉音乐，你对人物的判断会变吗？"], "notes": "请大家先回想十几秒，再选一个片段回答。尽量用一处具体声音变化说明感受，例如旋律进入、节奏持续、台词突出，或者某一层声音停下。我们想听不同判断，也欢迎指出还有哪些比较需要回到影片核对。谢谢大家。", "layout": "text", "speaker": "AB", "minutes": 2.5, "sources": [], "prep": "邀请2—3位；没人发言可回放05末尾20秒，不把去配乐问题冒充已做对照实验。"}, {"title": "参考资料", "body": ["影片与数据：Criterion、奥斯卡官方、Box Office Mojo", "创作背景：坂本龙一访谈、摄影师大师课", "评论：Ebert、Thomson、Kempley、豆瓣、配乐专栏", "课程概念：讲义第三部分25—39、55—57页"], "notes": "完整链接及各项资料的采用方式见配套参考资料。课堂照片帮助我们学习案例组织和主题重现的比较方法；具体音乐结论仍保留来源和核验范围。", "layout": "text", "speaker": "AB", "minutes": 0.2, "sources": ["P05", "FACT", "AWARD", "P01", "P03", "R01", "R02", "R03", "R06", "R07", "COURSE", "SAMPLE"], "prep": ""}, {"title": "答疑与回放", "body": ["如何确认两段音乐材料相同或相近？", "怎样区分乐器音色与电子制作？", "哪些段落连接了不同的时间或空间？", "影片怎样表现人物，又怎样引导评价？"], "notes": "这一页备用。可以根据提问回放相应视频或原声，再讨论主题、音色、声源和剪辑的关系。", "layout": "text", "speaker": "AB", "minutes": 0, "sources": [], "prep": "具体乐器、调式、精确cue起止尚未完成听辨，不以猜测补全。"}];let index=0;const stage=document.getElementById('stage'),notes=document.getElementById('notes'),choose=document.getElementById('choose');const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));slides.forEach((s,i)=>choose.add(new Option((i+1)+' '+s.title,i)));function media(f){return f.endsWith('.mp4')?'<video controls preload="metadata" src="媒体/'+encodeURIComponent(f)+'"></video>':'<audio controls preload="metadata" src="媒体/'+encodeURIComponent(f)+'"></audio>'}function show(i){document.querySelectorAll('video,audio').forEach(m=>m.pause());index=Math.max(0,Math.min(slides.length-1,i));let s=slides[index];stage.className=s.layout;let imgs=(s.images||[]).map((f,k)=>'<figure><img src="图片/'+encodeURIComponent(f)+'" alt="'+esc(f)+'">'+(s.captions?'<figcaption>'+esc(s.captions[k])+'</figcaption>':'')+'</figure>').join('');let visual=s.layout==='video'?media(s.media):'<div class="visuals">'+imgs+'</div>';stage.innerHTML='<h1>'+esc(s.title)+'</h1>'+visual+(s.subtitle?'<div class="sub">'+esc(s.subtitle)+'</div>':'')+'<div class="body">'+s.body.map(t=>'<p>'+esc(t)+'</p>').join('')+'</div>'+(s.media&&s.layout!=='video'?media(s.media):'')+(s.secondMedia?media(s.secondMedia):'');notes.textContent='讲者 '+s.speaker+'　预算 '+s.minutes+'分钟\n\n'+s.notes;choose.value=index;document.getElementById('counter').textContent=(index+1)+' / '+slides.length;location.hash='s'+(index+1)}document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);choose.onchange=()=>show(+choose.value);function full(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}document.getElementById('full').onclick=full;function note(){notes.hidden=!notes.hidden}document.getElementById('note').onclick=note;document.addEventListener('keydown',e=>{if(['VIDEO','AUDIO','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown')show(index+1);if(e.key==='ArrowLeft'||e.key==='PageUp')show(index-1);if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='f')full();if(e.key.toLowerCase()==='n')note()});show(Math.max(0,parseInt(location.hash.slice(2)||'1')-1));</script></html>
