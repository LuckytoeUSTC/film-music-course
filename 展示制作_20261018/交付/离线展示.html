<style>*{box-sizing:border-box}body{margin:0;background:#171714;color:#f1e7d3;font-family:"Microsoft YaHei",sans-serif}main{max-width:1280px;margin:auto;min-height:90vh;padding:3.2vh 4vw}h1{font-size:clamp(28px,3.4vw,46px);margin:0 0 3vh}.visuals{display:flex;gap:2vw;align-items:center;justify-content:center}.visuals figure{margin:0;flex:1;min-width:0}.visuals img{width:100%;max-height:54vh;object-fit:contain}figcaption{font-size:18px;color:#d5b16b;margin-top:14px}video{display:block;width:100%;max-height:65vh;background:black}audio{width:min(580px,90%);margin:14px 0}.body{font-size:clamp(20px,2.2vw,31px);line-height:1.5}.body p{margin:.65em 0}.cover h1{font-size:clamp(36px,4.5vw,62px);margin-top:2vh}.cover .visuals img{max-height:58vh}.sub{color:#d5b16b;font-size:28px}.video .body{font-size:24px}nav{position:fixed;bottom:0;width:100%;display:flex;align-items:center;gap:14px;padding:10px 24px;background:#171714ee;font-size:14px}button,select{background:#292820;color:#f1e7d3;border:1px solid #74634b;padding:8px 12px;font-size:14px}#notes{white-space:pre-wrap;background:#292820;padding:22px;font-size:19px;line-height:1.8;margin-bottom:70px}#notes[hidden]{display:none}a{color:#d5b16b}main{padding-bottom:70px}</style>

<script>const slides=[{"title": "宫门之内的奔跑", "subtitle": "《末代皇帝》的声音与人物处境", "layout": "cover", "images": ["02205_追阿嬷远景.jpg"], "body": [], "speaker": "A", "minutes": 0.5, "notes": "今天从一个反复出现的动作开始：奔跑。溥仪是皇帝，却常常不能决定自己去哪里、与谁在一起。我们比较几段移动、离开与受阻的场景，看看画面如何安排人物的位置，声音又怎样改变我们与人物的距离。这里讨论的是电影塑造人物的方法，历史事件只作必要背景。先请大家听一小段片头音乐，暂时不用猜乐器。", "sources": []}, {"title": "先听片头", "layout": "hero", "images": ["00035_片头题字.jpg"], "body": ["如果没有画面，你会想到怎样的空间？", "哪些声音在重复，哪些声音逐层加入？"], "media": "音频_10.m4a", "speaker": "A", "minutes": 2, "notes": "播放35秒片头音乐。请大家先说听到的具体变化：节奏是否连续，旋律声部何时更突出，声音是密集还是疏朗。等待两位同学回答，共约40秒。有人联想到宫殿、仪式或中国，我们继续问：这种联想来自音色、旋律，还是来自已经知道片名？Main Title Theme的作者是David Byrne。稍后再区分文化联想与历史音乐。这里不设唯一情绪答案，也不将猜中乐器作为互动目标。", "sources": ["P06", "R06"]}, {"title": "溥仪的处境变化", "layout": "split", "images": ["04844_紫禁城离开.jpg"], "body": ["童年登基，在宫墙内成长", "离宫后的生活与复辟欲望", "伪满洲国的傀儡身份", "被囚、改造，成为普通公民", "重返已开放的故宫"], "speaker": "A", "minutes": 1.5, "notes": "只用这条线帮助没有看过电影的同学定位。影片并非从童年顺序讲到晚年，而是从1950年的囚犯处境进入回忆。童年的皇帝身份给他特殊待遇，也使他与外界隔绝。离开宫殿并不使控制关系自动消失，他后来选择依靠日本势力谋求皇位。战后被囚，最终作为普通人重访故宫。下面每个片段只补充理解当下动作所需的剧情，不重复讲完整传记。", "sources": ["P05"]}, {"title": "三位作曲者与现代制作", "layout": "text", "body": ["坂本龙一：电子音乐经验与管弦乐写作", "David Byrne：片头Main Title Theme等", "苏聪：宫廷场景中的中国音乐创作", "真实乐器录音与电子制作可以同时存在"], "speaker": "A", "minutes": 1.5, "notes": "影片原创配乐的获奖署名有三位，不能把全部音乐归到坂本龙一名下。坂本的YMO经历使电子音乐背景值得介绍，但只需用一句话，没必要把展示变成个人生平。他在访谈中回忆先以演员身份参与，之后才受邀写音乐，并在东京找中国音乐家录音。这说明真实演奏与现代制作可以并存。苏聪和Byrne也有各自贡献，具体段落不能只凭作曲者国籍推断。奖项是1988年颁给1987年影片的，不必用奖项代替分析。", "sources": ["P01", "P02", "P04", "R06"]}, {"title": "“中国感”怎样形成", "layout": "text", "body": ["音色：弓弦、拨弦、打击与持续音", "旋律、节奏与声部层次", "录音、电子加工和混音", "听众的经验与银幕上的宫殿"], "speaker": "A", "minutes": 1.5, "notes": "所谓故宫音色，在这里先当作一个需要解释的听众联想。我们可以描述弓弦的滑动、拨弦的颗粒、打击的起音与持续的背景，但未核实就不要给每个声部贴上乐器名。真实二胡和具有近似音色的弦乐、采样或合成音，在成品混音里不一定容易区分。更重要的是，同一声音配上宫门、红墙和皇帝服饰后，我们可能更容易把它听成中国宫廷。电影配乐营造特定世界，不等于清代宫廷音乐的历史复原。", "sources": ["P01", "R06"]}, {"title": "同一座宫城，不同的位置", "layout": "triple", "images": ["00554_紫禁城初见.jpg", "02484_庄士敦到来.jpg", "09338_重访背影.jpg"], "captions": ["00:09:14　初入宫城", "00:41:24　庄士敦到来", "02:35:38　普通人重返"], "body": ["建筑延续，人物、交通工具和通行方式改变"], "speaker": "A", "minutes": 1.7, "notes": "这三幅画面不是同一个机位的严格复现，因此只比较空间关系，不说镜头完全相同。第一幅宫门前有队伍、牲畜和礼制秩序，第二幅汽车、自行车与宫门同框，第三幅人物独自走向殿宇。建筑相对稳定，进入其中的人及其身份不断改变。所谓宏大，首先可以由建筑尺度、轴线和人物比例说明。孤寂则还需要动作、叙事和声音支持，不能看到大宫殿就直接得出孤独的结论。可按需要播放媒体03或06补充移动过程。", "sources": ["R02", "P03"]}, {"title": "远景里的小人物", "layout": "hero", "images": ["01640_童年奔跑全景.jpg"], "body": ["人物移动，建筑保持稳定", "权力的中心，也可能是行动的边界"], "speaker": "A", "minutes": 1.2, "notes": "先看画面本身。孩子和随从在巨大的庭院中移动，镜头让我们看到个人动作与制度空间的比例。即使人物穿着最显眼的服饰，他仍只占画面很小的一部分。我们可以把这作为人物受到环境组织的视觉证据，但不能只凭远景证明人物在想什么。声音可能让我们更靠近他的兴奋或焦急，也可能让建筑和距离更突出。接下来用追阿嬷的完整片段比较，而不是孤立解释这张截图。", "sources": []}, {"title": "追阿嬷：运动与距离", "layout": "video", "images": ["02185_追阿嬷奔跑.jpg"], "body": ["从近处的动作，走向宫殿远景", "听声音怎样连接或分开这些镜头"], "media": "05_追阿嬷.mp4", "speaker": "A", "minutes": 3.1, "notes": "交代一句背景：乳母被送离，孩子试图追上她。播放90秒，保留追逐前的对话和切回成年囚犯的部分。请大家观察镜头距离的变化，同时听音乐、人声和环境声各占怎样的位置。播放后问：最让你感觉追不上的是奔跑本身、人物变小，还是声音的变化？等待约20秒。这里可以提出我们的解释：人物越努力移动，远景越让距离显现。但若要指出音乐在哪一秒消失，必须在实际播放时确认，不能把书签当起点。原声Where Is Armo是核对线索，不用专辑曲名替代原片听辨。", "sources": ["R07", "D01", "R06"]}, {"title": "追婉容：相似动作，成年处境", "layout": "video", "images": ["08218_追婉容门.jpg"], "body": ["又一次追逐，又一次要求开门", "比较动作的结果，也比较声音的处理"], "media": "10_追婉容.mp4", "speaker": "A", "minutes": 2.8, "notes": "播放70秒。此时婉容被送走，成年溥仪追出，最终仍要求别人开门。与童年片段可比的是追逐对象的离开、他的追随与受阻，不是因为两段一定用了同一音乐。请大家比较声音是否同样组织时间：哪里让动作连贯，哪里让等待和停顿变得突出？这两个场景相隔很远，但类似动作使人物处境产生呼应。与此同时，成年溥仪的政治和私人选择也参与形成处境，不能把两段相似简化成他从来都没有任何选择。", "sources": ["R07", "R04"]}, {"title": "文绣在雨中离开", "layout": "video", "images": ["05860_雨.jpg"], "body": ["“离开”在这里有了不同的结果", "雨、身体动作与音乐共同决定感受"], "media": "09_雨中离开.mp4", "speaker": "B", "minutes": 2.8, "notes": "播放65秒，先交代她提出离婚。注意她拒绝伞的动作与字幕，再听雨声、音乐和动作的关系。这里是前面解释的检验：如果所有奔跑和移动都只是被命运困住，这一段就无法解释。文绣走出去的结果与溥仪的受阻不同，音乐是否使离开带有释放感，请大家用刚听到的速度、力度和声部变化说明。Rain是有署名的原声曲目，坂本访谈也谈到过它，但专辑与影片剪辑可能有差异。不要因为曲名叫雨，就把雨声本身当成这首配乐。", "sources": ["P01", "D03"]}, {"title": "奔跑与自行车", "layout": "pair", "images": ["01633_奔跑.jpg", "03205_自行车宫门.jpg"], "captions": ["童年的奔跑", "自行车带来新的移动方式"], "body": ["更快的运动，是否带来更大的自由？"], "speaker": "B", "minutes": 1.4, "notes": "自行车既是现代生活的物件，也使人物在空间里的移动方式发生变化。Ebert特别注意到出宫受阻这一层反讽。这里不把评论直接当结论，请看宫门的位置、人物停留的位置，以及决定通行的是谁。若时间充裕，播放备选媒体07。问题不只是他能不能跑得更快，而是他有没有决定去向的能力。与文绣放在一起，移动速度和行动自主之间的差别就更清楚。", "sources": ["R01"]}, {"title": "颜色的安排与人物阶段", "layout": "triple", "images": ["00399_回忆宫门.jpg", "03196_自行车.jpg", "04860_离宫全景.jpg"], "captions": ["红与进入回忆", "绿色物件与外界知识", "离宫与身份变化"], "body": ["Storaro的创作自述提供线索，不是固定解码表"], "speaker": "B", "minutes": 1.8, "notes": "摄影师Storaro在大师课中把颜色联系到人生阶段，举过绿色汽车和自行车的例子。我们因此可以讨论绿色物件怎样把外界带进宫城，但不需要记一张所有颜色的象征对照表。还要注意颜色受服装、光线和发行版本影响，本次截图经过HDR到SDR转换，不能据此做精确色值分析。音乐色彩是比喻，画面颜色是可见特征。比较两者时，可以说疏密、张力或变化是否呼应，不能说绿色天然对应某种调式或乐器。", "sources": ["P03"]}, {"title": "回忆怎样开始", "layout": "video", "images": ["00390_首次转场.jpg"], "body": ["1950年的身体，接到1908年的宫门", "镜头跨越时间，声音可以组织连续感"], "media": "02_首次回忆转场.mp4", "speaker": "B", "minutes": 2.1, "notes": "播放45秒。注意成人近景、浴室、红色与童年宫门之间的联系。先确定画面已经发生时间跳转，再问声音是跟着新画面改变，还是跨过剪辑延续。即使同一音乐跨了两个时代，也不构成物理不可能，因为电影叙述层的音乐本来就不必来自人物所处的现场。如果是故事内的声音跨过剪辑，也可以是声音桥或主观记忆，并非两处现实空间同时存在同一声源。此处是否属于哪一种，依据实际播放时可辨认的声源说明。", "sources": ["P03"]}, {"title": "声源、声音桥与静默", "layout": "text", "body": ["有源：音乐属于故事世界", "无源：音乐位于影片叙述层", "声音桥：声音跨过镜头或场景切换", "无配乐时，台词与环境声仍可存在"], "speaker": "B", "minutes": 1.7, "notes": "这是三个不同问题。第一问音乐从哪里来，第二问声音如何跨剪辑，第三问配乐有没有出现。它们不能互相代替。人物看不见乐器，也不能立即断言无源，因为声源可能在画外。反过来，电影配乐即使有很强的地方特色，也不说明人物能听见。所谓静默也要说明是哪一层声音退下了。可以用备选媒体11检验枪声与转场，但当前材料没有完成逐声轨核验，讲述时不要提前写死枪声究竟来自上一场还是下一场。", "sources": ["COURSE"]}, {"title": "主题重现与编配变化", "layout": "text", "body": ["先比较旋律轮廓、节奏和乐句", "再比较音色、织体与力度", "相同材料换了处境，意义可能改变"], "media": "音频_08.m4a", "secondMedia": "音频_09.m4a", "speaker": "B", "minutes": 2.2, "notes": "播放原声Theme Variation 2的30秒与Theme的35秒。先请大家找相似或不同的材料，再说声音处理如何改变距离感、稳定感与张力。这是专辑内的比较，不能自动证明它们在影片中的出现顺序，也不能称为某一场景的精确配乐版本。Variation这个曲名是作者/专辑提供的关联线索，实际分析仍须听旋律与织体。有电子音乐背景不代表所有片段都是合成器演奏，真实乐器与电子层可以叠加存在。", "sources": ["R06"]}, {"title": "评论之间并不一致", "layout": "text", "body": ["Ebert：受限的行动值得理解", "Thomson：宏大中也有日常细节", "Kempley：华丽形式未必带来戏剧张力", "观看人物的处境，也追问他的选择"], "speaker": "B", "minutes": 1.8, "notes": "这些评论帮助我们提出不同问题，而不是替我们决定答案。一种读法认为人物越被动，周围庞大的仪式和场面越有反讽力量。另一种读法担心画面压过人物，使观众只能欣赏形式。我们保留这场分歧，因此展示不以这部电影获了多少奖收尾，而是回到选段：视听形式究竟使我们更理解人物的行动，还是只是使他显得可怜？对处境的同情和对行为责任的评价可以同时存在。", "sources": ["R01", "R02", "R03", "R04"]}, {"title": "重返龙椅", "layout": "video", "images": ["09385_重返龙椅.jpg"], "body": ["皇帝身份成为一段需要证明的记忆", "宏大的空间里，留下一个小物件"], "media": "13_龙椅与蝈蝈.mp4", "speaker": "B", "minutes": 2.8, "notes": "先用一张重访远景交代身份变化，再播放92秒身份对话与蝈蝈相关片段。这里的证据是他与孩子的交谈、昔日位置和小物件，不把蝈蝈的存在当成写实历史证据。人物重回宫殿，拥有宫殿的关系已改变。请听结尾将注意力放在什么声音上，以及它与早期仪式场面的差别。若听到不同层次，可指出实际位置，但不预设所有人都感到释然。这个结尾也允许复杂的感受，不能用最终自由了把整个人生压平。", "sources": ["R01"]}, {"title": "声音怎样参与人物叙事", "layout": "text", "body": ["空间尺度让人物的行动显得有限", "相似动作使不同处境可以比较", "声音决定观众靠近什么、等待什么", "同情人物与判断责任可以并存"], "speaker": "A", "minutes": 1.3, "notes": "回到开头的问题。我们从宫门、远景和行动结果解释人物处境，再用声音检验情感怎样形成。这里不需要宣布一种统一的故宫音色，更不需要把每一次音乐都解释成命运。比较最有用的地方，是相似动作中仍有差别：童年与成年不能完全相同，溥仪与文绣也有不同的选择和结果。音乐进入电影之后，重要的不只是作品本身是否优美，也包括它出现在哪里、与什么画面和声音一起出现。", "sources": []}, {"title": "讨论", "layout": "text", "body": ["哪一个片段最改变你对人物的距离感？", "请指出一个画面细节和一个声音细节", "这种同情会影响你对人物选择的判断吗？"], "speaker": "AB", "minutes": 3, "notes": "先给大家15秒回想，再请两到三位同学回答。不要求回答统一。若只出现悲伤、震撼等形容词，追问它来自哪个具体镜头或声音变化。若讨论转成历史人物评价，提醒本次先区分电影怎样呈现和历史怎样发生；可以承认电影的视角有局限。若没人发言，可重放追阿嬷末尾20秒，询问人物在画面中的大小与人声的位置。预留老师追问，不用占满45分钟。", "sources": []}, {"title": "主要参考资料", "layout": "refs", "body": ["Hillary Weston，坂本龙一访谈，Criterion，2017", "Vittorio Storaro，里斯本大师课，2017，第10—11页", "Roger Ebert，The Last Emperor，1987", "David Thomson，Criterion专栏，2009", "Jonathan Broxton，Movie Music UK配乐评论，2017"], "speaker": "AB", "minutes": 0.2, "notes": "完整链接和阅读范围见配套《评论阅读与取舍》。访谈用于创作经历，影评用于有归属的观点，电影画面与声音用于片段分析。本地影片约162分54秒，片段时间码只适用于这份资源。", "sources": ["P01", "P03", "R01", "R02", "R06"]}, {"title": "评论与课程参考", "layout": "refs", "body": ["Diana，豆瓣《有哪些亮点和记忆点？》，2019", "Rita Kempley，Washington Post，1987", "James Berardinelli，ReelViews", "Oliver Stone，1998影评，导演官方档案转载", "课程《电影音乐》第三部分，第25—39、55—57页"], "speaker": "AB", "minutes": 0.2, "notes": "另外检索到的豆瓣长短评中，有些只能取得搜索摘录，其阅读边界在配套资料中分别标注。没有把有限样本当成观众共识。Rita Kempley只采用简短的反面评价。Oliver Stone评论的是较长版本，不能作为当前选段证据。", "sources": ["R07", "R03", "R04", "R05", "COURSE"]}, {"title": "备用片段", "layout": "text", "body": ["童年奔跑　00:27:05—00:28:05", "自行车　00:53:05—00:54:05", "枪声附近转场　02:20:35—02:21:05", "重访远景　02:35:15—02:36:05"], "speaker": "AB", "minutes": 0, "notes": "备用页，不计入主讲。仅在老师追问或需要补充证据时使用。全部视频与原声摘录也在离线播放页，可按原片时间回查。备用片段不因有书签就自动具有音乐分析价值。", "sources": []}, {"title": "分析用语的范围", "layout": "text", "body": ["相似旋律不必然等于同一录音", "声画同步要说明同步的是节奏还是情绪", "无配乐不等于没有声音", "银幕中的历史人物不等于完整历史"], "speaker": "AB", "minutes": 0, "notes": "答疑备用。若被问具体乐器、调式或音乐cue起止，能确认的给出处，不能确认的不补猜测。必要时承认当前没有总谱、分轨和逐声部制作资料。", "sources": ["COURSE"]}];let index=0;const stage=document.getElementById('stage'),notes=document.getElementById('notes'),choose=document.getElementById('choose');const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));slides.forEach((s,i)=>choose.add(new Option((i+1)+' '+s.title,i)));function media(f){return f.endsWith('.mp4')?'<video controls preload="metadata" src="媒体/'+encodeURIComponent(f)+'"></video>':'<audio controls preload="metadata" src="媒体/'+encodeURIComponent(f)+'"></audio>'}function show(i){document.querySelectorAll('video,audio').forEach(m=>m.pause());index=Math.max(0,Math.min(slides.length-1,i));let s=slides[index];stage.className=s.layout;let imgs=(s.images||[]).map((f,k)=>'<figure><img src="图片/'+encodeURIComponent(f)+'" alt="'+esc(f)+'">'+(s.captions?'<figcaption>'+esc(s.captions[k])+'</figcaption>':'')+'</figure>').join('');let visual=s.layout==='video'?media(s.media):'<div class="visuals">'+imgs+'</div>';stage.innerHTML='<h1>'+esc(s.title)+'</h1>'+visual+(s.subtitle?'<div class="sub">'+esc(s.subtitle)+'</div>':'')+'<div class="body">'+s.body.map(t=>'<p>'+esc(t)+'</p>').join('')+'</div>'+(s.media&&s.layout!=='video'?media(s.media):'')+(s.secondMedia?media(s.secondMedia):'');notes.textContent='讲者 '+s.speaker+'　预算 '+s.minutes+'分钟

'+s.notes;choose.value=index;document.getElementById('counter').textContent=(index+1)+' / '+slides.length;location.hash='s'+(index+1)}document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);choose.onchange=()=>show(+choose.value);function full(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}document.getElementById('full').onclick=full;function note(){notes.hidden=!notes.hidden}document.getElementById('note').onclick=note;document.addEventListener('keydown',e=>{if(['VIDEO','AUDIO','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown')show(index+1);if(e.key==='ArrowLeft'||e.key==='PageUp')show(index-1);if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='f')full();if(e.key.toLowerCase()==='n')note()});show(Math.max(0,parseInt(location.hash.slice(2)||'1')-1));</script></html>
